<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess</title>
  <link rel="stylesheet" href="../CSS/chess.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">CHESS</div>
      <div class="top-status" id="topStatus">Use arrow keys · Enter to select</div>
      <div class="top-actions">
        <button class="btn" id="btnMenu" type="button">Menu</button>
      </div>
    </header>

    <main class="layout">
      <section class="board-area" id="boardArea">
        <div class="player-bar top" id="topPlayer">
          <div class="player-meta">
            <span class="player-name" id="topName">Black</span>
            <span class="player-tag" id="topTag"></span>
          </div>
          <div class="player-clock" id="topClock">--:--</div>
        </div>

        <div class="board-wrap" id="boardWrap">
          <div class="board" id="board" aria-label="Chess board"></div>
          <div class="promo-overlay hidden" id="promoOverlay">
            <div class="promo-title">Promote to</div>
            <div class="promo-row" id="promoRow"></div>
          </div>
        </div>

        <div class="player-bar bottom" id="bottomPlayer">
          <div class="player-meta">
            <span class="player-name" id="bottomName">White</span>
            <span class="player-tag" id="bottomTag"></span>
          </div>
          <div class="player-clock" id="bottomClock">--:--</div>
        </div>
      </section>

      <aside class="side">
        <div class="panel status-panel">
          <div class="panel-label">Status</div>
          <div class="status-line" id="statusLine">Pick a mode from the menu</div>
          <div class="eval-wrap">
            <div class="eval-label">Eval</div>
            <div class="eval-bar" id="evalBar">
              <div class="eval-fill" id="evalFill"></div>
              <div class="eval-center"></div>
            </div>
            <div class="eval-score" id="evalScore">0.0</div>
          </div>
        </div>

        <div class="panel moves-panel">
          <div class="panel-label">Moves</div>
          <div class="moves" id="moveList"></div>
        </div>

        <div class="panel info-panel" id="infoPanel">
          <div class="panel-label">Game</div>
          <div class="info-row"><span>Mode</span><strong id="infoMode">—</strong></div>
          <div class="info-row"><span>Difficulty</span><strong id="infoDiff">—</strong></div>
          <div class="info-row"><span>Turn</span><strong id="infoTurn">—</strong></div>
          <div class="info-row"><span>Room</span><strong id="infoRoom">—</strong></div>
        </div>

        <div class="panel help-panel">
          <div class="panel-label">Controls</div>
          <div class="help-row"><kbd>↑↓←→</kbd> move cursor</div>
          <div class="help-row"><kbd>Enter</kbd> select / move</div>
          <div class="help-row"><kbd>Enter</kbd> again cancel</div>
          <div class="help-row"><kbd>↑</kbd> on top row = menu</div>
        </div>
      </aside>
    </main>

    <div class="modal-layer hidden" id="modalLayer">
      <div class="modal" id="modal">
        <div class="modal-title" id="modalTitle">Menu</div>
        <div class="modal-desc" id="modalDesc"></div>
        <div class="menu-list" id="menuList"></div>
        <div class="modal-hint">Arrow keys to move · Enter to choose</div>
      </div>
    </div>

    <div class="toast hidden" id="toast"></div>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="../JS/chess.js"></script>
</body>
</html>
