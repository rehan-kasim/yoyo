<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YOYO GAMES</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #2b2f36;
  font-family: Tahoma, Verdana, sans-serif;
  user-select: none;
}
.panel {
  width: 340px;
  background: #d6d3cf;
  border: 2px solid #555;
  border-radius: 6px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,.5);
}
.bar {
  background: #3a6ea5;
  color: #fff;
  padding: 10px 14px;
  font-size: 14px;
  font-weight: bold;
  letter-spacing: 1px;
}
.bar small {
  display: block;
  font-weight: normal;
  font-size: 10px;
  letter-spacing: 0;
  margin-top: 3px;
  color: #cfe0f5;
}
.list {
  list-style: none;
  padding: 10px;
}
.list li {
  padding: 9px 14px;
  margin: 4px 0;
  font-size: 14px;
  color: #222;
  border-radius: 3px;
  border: 1px solid transparent;
  cursor: pointer;
}
.list li.on {
  background: #0a246a;
  color: #fff;
  border-color: #0a246a;
}
.list li .tag {
  float: right;
  font-size: 11px;
  opacity: .7;
}
.foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 9px 14px;
  background: #c9c6c1;
  border-top: 1px solid #999;
  font-size: 11px;
  color: #444;
}
.foot b {
  color: #0a246a;
}
</style>
</head>
<body>
<div class="panel">
  <div class="bar">YOYO GAMES<small>arrow keys or mouse &middot; pick a game</small></div>
  <ul class="list" id="list">
    <li data-go="HTML/2048.html">2048 <span class="tag">puzzle</span></li>
    <li data-go="HTML/wordle.html">Wordle <span class="tag">words</span></li>
    <li data-go="HTML/chess.html">Chess <span class="tag">board</span></li>
    <li data-go="HTML/pong.html">Pong <span class="tag">retro</span></li>
    <li data-go="HTML/snake.html">Snake <span class="tag">classic</span></li>
    <li data-go="HTML/tictactoe.html">Tic Tac Toe <span class="tag">versus</span></li>
    <li data-go="HTML/sudoku.html">Sudoku <span class="tag">logic</span></li>
    <li data-go="HTML/memory.html">Memory <span class="tag">pairs</span></li>
  </ul>
  <div class="foot">
    <span><b>&uarr;</b> <b>&darr;</b> move &nbsp; <b>enter</b> / <b>click</b> play</span>
    <span id="status">ready</span>
  </div>
</div>
<script>
var items = document.querySelectorAll('#list li');
var status = document.getElementById('status');
var current = 0;
var busy = false;

function paint() {
  items.forEach(function (li, i) {
    li.classList.toggle('on', i === current);
  });
  if (!busy) {
    status.textContent = items[current].childNodes[0].textContent.trim() + ' selected';
  }
}

function step(dir) {
  current = (current + dir + items.length) % items.length;
  paint();
}

function launch() {
  var name = items[current].childNodes[0].textContent.trim();
  var go = items[current].getAttribute('data-go');
  busy = true;
  status.textContent = 'loading ' + name.toLowerCase() + ' ...';
  if (go) {
    setTimeout(function () {
      location.href = go;
    }, 350);
    return;
  }
  setTimeout(function () {
    status.textContent = name + ' coming soon';
    busy = false;
    setTimeout(function () {
      status.textContent = items[current].childNodes[0].textContent.trim() + ' selected';
    }, 1400);
  }, 900);
}

items.forEach(function (li, i) {
  li.addEventListener('click', function () {
    if (busy) return;
    current = i;
    paint();
    launch();
  });
});

document.addEventListener('keydown', function (e) {
  if (busy) return;
  if (e.key === 'ArrowUp') {
    e.preventDefault();
    step(-1);
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    step(1);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    launch();
  }
});

paint();
</script>
</body>
</html>
